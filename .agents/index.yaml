format: "bapx-project-knowledge-index"
version: "1.0"
generated_by: "cli/generate-okf-bundle.php"
authoritative_sources:
  runtime_data: "https://nebowellness.com/remotedb"
  schema: "storage/schema/collections.php"
  blogs: "content/blog/posts/*.md"
  images: "assets/images/**/*"
  code_map: ".agents/map.mmd"
  knowledge_index: ".agents/index.yaml"
  documentation_map: "docs/map.mmd"
rules:
  - "Concepts are original project resources; this index never copies blog bodies or runtime records."
  - "Products, categories, consultants, campaigns and other editable records are queried from remotedb."
  - "Blog Markdown and image binaries remain local files."
  - "Read discovery first; query only the relevant section or resource. Do not load this entire index into agent context."
  - "Use at least three evidence hops: entry instructions, exact index match, original source; continue through each affected route, controller, service, schema, view and browser state needed to verify a change."
discovery:
  - question: "Does a route, controller, service, view or collection exist?"
    use: "docs/project-index.json"
  - question: "How are routes, controllers, services and collections connected?"
    use: ".agents/map.mmd"
  - question: "What is the live product, category, consultant, campaign or admin-editable value?"
    use: "https://nebowellness.com/remotedb"
  - question: "Where is a blog article and what frontmatter does it declare?"
    use: "concepts filtered by type=blog, then read its resource"
  - question: "Where is an image and which source files reference it?"
    use: "concepts filtered by type=image; query by filename or resource"
  - question: "What repository instructions or skill apply?"
    use: "AGENTS.md, then .agents/skills; use .agents/REA/skills for source-derived engineering"
  - question: "Where do I start debugging a feature or release?"
    use: "docs/README.md"
  - question: "What changed in a release or is awaiting release?"
    use: "docs/changelog.md; verify the Git tag and production deployment separately"
query_examples:
  - "sed -n '1,/^concepts:$/p' .agents/index.yaml"
  - "jq --arg path \"/contact\" '[.routes[] | select(.path == $path)]' docs/project-index.json"
  - "rg -n -B4 -A14 'id: \"<concept-id>\"' .agents/index.yaml"
  - "rg -n -A10 'id: \"blog:gut-friendly-meals\"' .agents/index.yaml"
  - "rg -n -B4 -A12 'filename: \"<name>\"' .agents/index.yaml"
  - "rg -n -B4 -A14 'path: \"/shop\"' .agents/index.yaml"
  - "rg -n -B4 -A12 'type: \"skill\"' .agents/index.yaml"
  - "rg -n '<term>' docs/project-index.json .agents/map.mmd .agents/index.yaml"
