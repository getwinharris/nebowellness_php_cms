name: Open branch pull request

on:
  push:
    branches:
      - 'codex/**'
      - 'fix/**'
      - 'feat/**'
      - 'bapX/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: branch-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open:
    if: github.repository == 'getwinharris/nebowellness_php_cms'
    runs-on: ubuntu-latest
    steps:
      - name: Create bapXai installation token
        id: app-token
        if: vars.BAPXAI_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BAPXAI_APP_ID }}
          private-key: ${{ secrets.BAPXAI_PRIVATE_KEY }}
      - uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            try {
              const head = context.ref.replace('refs/heads/', '');
              const pulls = await github.rest.pulls.list({
                ...context.repo,
                state: 'open',
                head: `${context.repo.owner}:${head}`,
                base: 'main'
              });
              const reviewRequest = '[**@codex**](https://github.com/codex) review';
              if (pulls.data.length) {
                const { number: issue_number, head: currentHead } = pulls.data[0];
                if (currentHead.sha !== context.sha) {
                  core.info(`PR #${issue_number} has advanced past this push`);
                  return;
                }
                const marker = `<!-- codex-review:${context.sha} -->`;
                const comments = await github.paginate(github.rest.issues.listComments, {
                  ...context.repo, issue_number
                });
                if (!comments.some(comment => (comment.body || '').includes(marker))) {
                  await github.rest.issues.createComment({
                    ...context.repo, issue_number, body: `${reviewRequest}\n\n${marker}`
                  });
                }
                core.info(`PR #${issue_number} already tracks ${head}`);
                return;
              }
              const title = head
                .replace(/^(codex|fix|feat|bapX)\//, '')
                .replace(/[-_]+/g, ' ')
                .replace(/\b\w/g, value => value.toUpperCase());
              const result = await github.rest.pulls.create({
                ...context.repo,
                title,
                head,
                base: 'main',
                body: [
                  'Created automatically from a pushed implementation branch.',
                  '',
                  'GitHub Actions owns CI and pull-request creation.',
                  'Merge after validation and the latest review findings are resolved.',
                  '',
                  reviewRequest
                ].join('\n')
              });
              core.info(`Created PR #${result.data.number}`);
            } catch (error) {
              if (error.status === 403) {
                core.warning('The GitHub token lacks permission to create the PR or request review. Configure the bapXai GitHub App or enable Actions pull-request creation in repository settings.');
                return;
              }
              throw error;
            }
