name: Validate application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'ci-ai-bot' && github.repository == 'getwinharris/nebowellness_php_cms'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Support browser behavior
        run: node --test tests/support-chat.test.cjs
      - name: Validate code, tests, maps, and routes
        run: ./bapXphp ci
