name: Validate application

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**', 'codex/**', 'bapX/**']

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'ci-ai-bot' && github.repository == 'getwinharris/nebowellness_php_cms'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring, dom, libxml, gd, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify JavaScript behavior
        run: node --test tests/*.test.cjs
      - name: Require REA capability impact review
        if: github.event_name == 'pull_request'
        env:
          REA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./bapXcms rea impact "$REA_BASE_SHA"
      - name: Validate code, tests, maps, and routes
        run: ./bapXcms ci

      - name: Verify isolated JSON-backed remoteDB transport and native collection contracts
        run: node --test tests/remote-collection-contract.cjs
      - name: Record acceptance scope
        run: |
          echo "Default CI uses PHP/JS, private file fixtures and the remoteDB wire contract."
          echo "Historical direct-engine integration suites are retained but not run."
          echo "No production database mutation or engine-specific acceptance is claimed."
